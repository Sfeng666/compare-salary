name: Merge approved location data
on:
  workflow_run:
    workflows: [Validate location contribution, Location review submitted]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number already approved by the configured reviewer
        required: true
permissions:
  contents: write
  pull-requests: write
  statuses: read
  checks: read
jobs:
  merge:
    if: vars.LOCATION_AUTO_MERGE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request }}
          REVIEWER: ${{ vars.LOCATION_REVIEWER }}
        run: node scripts/merge-contribution.mjs
